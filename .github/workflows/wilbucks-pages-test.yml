name: Wilbucks GitHub Pages test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wilbucks-pages-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_PAGES_TEST: 'true'
      # Repository test URL only. The Vite default remains / for a future root custom-domain host.
      VITE_SITE_BASE: /wilbucks/
      VITE_ALLOW_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: node launch/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse custom-domain deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            if (data.cname || !data.html_url?.startsWith('https://wilbucks.github.io/')) {
              core.setFailed('Test deployment refused: Pages must use the GitHub address with no custom domain.');
            }
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy test only
        id: deployment
        uses: actions/deploy-pages@v4